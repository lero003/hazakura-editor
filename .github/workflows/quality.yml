name: Quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:vite
      - run: npm run smoke:app-store-surface
      - run: node --test scripts/local-assist-evaluation-checks.test.mjs
  native:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:vite
      - run: npm run build:apple-assist-helper:fixture
      - run: npm run build:import-assist-helper:fixture
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: swift test --package-path src-helpers/apple-assist
