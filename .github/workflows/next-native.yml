name: Next Native
on:
  pull_request:
    paths: ['next/**', '.github/workflows/next-native.yml']
  push:
    branches: [next-native-editor]
    paths: ['next/**', '.github/workflows/next-native.yml']
permissions:
  contents: read
concurrency:
  group: next-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  swift:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: swift --version
      - run: swift test --package-path next
      - run: bash next/scripts/run-dev.sh --build-only
