[package]
name = "hazakura-editor"
version = "3.3.0"
description = "Markdown-safe editor prototype"
authors = ["Hazakura Lab"]
edition = "2021"

[lib]
name = "hazakura_note_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", default-features = false, features = ["wry", "dynamic-acl"] }
rfd = { version = "=0.16.0", default-features = false, features = ["gtk3", "common-controls-v6"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSArray", "NSData", "NSError", "NSGeometry", "NSString", "NSURL"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

# On macOS 27, release-profile proc-macro dylibs without debug information can
# have a misaligned LINKEDIT string pool and fail to load during compilation.
# This only changes host build scripts/proc-macros, not the shipped app binary.
[profile.release.build-override]
debug = 2
codegen-units = 256
