<script>
(function () {
  "use strict";

  var core = window.HazakuraDashboardCore;
  var STORAGE_KEY = "hazakura-next-dashboard-history-v1";
  var MAX_LOAD_BYTES = 5 * 1024 * 1024;
  var TAB_NAMES = ["overview", "issues", "features", "safety", "acceptance", "ci", "history", "evidence"];
  var state = {
    data: null,
    sourceLabel: "埋め込みデータ",
    baseline: null,
    schemaWarnings: [],
    loadMessage: null,
    errorMessage: null,
    activeTab: "overview",
  };

  /* ------------------------------------------------------------------ *
   * Basics
   * ------------------------------------------------------------------ */

  function escapeHtml(value) {
    if (value === null || value === undefined) return "";
    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function formatDateJst(iso) {
    return core ? core.formatDateJst(iso) : String(iso || "不明");
  }

  function formatNumber(value) {
    var n = core.finiteNumber(value);
    return n === null ? "不明" : n.toLocaleString("ja-JP");
  }

  function formatPct(value) {
    var n = core.finiteNumber(value);
    return n === null ? "—" : n.toFixed(1) + "%";
  }

  function shortSha(value) {
    return core ? core.shortSha(value) : String(value || "不明").slice(0, 8);
  }

  function isPinnedRef(ref) {
    return /^[0-9a-f]{7,40}$/i.test(String(ref || ""));
  }

  function asArray(value) {
    return core ? core.asArray(value) : (Array.isArray(value) ? value : []);
  }

  function splitHeadline(text) {
    var t = String(text || "").trim();
    if (!t) return { lead: "現在の開発フェーズは未記録です。", rest: "" };
    var idx = t.indexOf("。");
    if (idx === -1) return { lead: t, rest: "" };
    return { lead: t.slice(0, idx + 1), rest: t.slice(idx + 1).trim() };
  }

  function toneForStatus(data, label) {
    var def = core.stateDef(data && data.evaluation, label);
    var tone = def && def.tone ? def.tone : "muted";
    if (tone === "proto" || tone === "info") return "info";
    if (tone === "parked" || tone === "muted") return "muted";
    if (tone === "strong") return "ok";
    return tone;
  }

  function statusLabel(data, label) {
    var tone = toneForStatus(data, label);
    return '<span class="status" data-tone="' + tone + '"><span class="dot" data-tone="' + tone + '"></span>' + escapeHtml(label) + "</span>";
  }

  function toneStatus(tone, label) {
    return '<span class="status" data-tone="' + escapeHtml(tone) + '"><span class="dot" data-tone="' + escapeHtml(tone) + '"></span>' + escapeHtml(label) + "</span>";
  }

  function resultStatus(text) {
    var status = core.classifyResultStatus(text);
    if (status === "実機受け入れ済み") return { label: "合格", tone: "ok" };
    if (status === "不合格") return { label: "不合格", tone: "alert" };
    if (status === "対象外") return { label: "対象外", tone: "muted" };
    if (status === "未測定") return { label: "未測定", tone: "muted" };
    return { label: "未確認", tone: "warn" };
  }

  function resultBadge(text) {
    var r = resultStatus(text);
    return toneStatus(r.tone, r.label);
  }

  function priorityTone(priority) {
    if (priority === "P0") return "alert";
    if (priority === "P1") return "warn";
    if (priority === "P2") return "info";
    return "muted";
  }

  function ownerLabel(ownerType) {
    if (ownerType === "agent") return "エージェント";
    if (ownerType === "owner_device") return "オーナー実機";
    if (ownerType === "both") return "協働";
    return "担当未設定";
  }

  function ciTone(ci) {
    return ci.tone || "muted";
  }

  function evidenceChips(ctx, evidenceList) {
    var entries = asArray(evidenceList).map(function (ev) {
      if (typeof ev === "string") return { label: ev, path: ev };
      return ev || {};
    }).filter(function (ev) { return ev.path || ev.label; });
    if (!entries.length) return "";
    var ref = ctx.evidenceRef;
    return (
      '<span class="evidence-list">' +
      entries.map(function (ev) {
        var label = ev.label || ev.path || "";
        var href = ref && isPinnedRef(ref) ? core.buildEvidenceUrl(ctx.repoUrl, ref, ev.path) : null;
        if (href) {
          return '<a class="evidence-chip" href="' + escapeHtml(href) + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(label) + "</a>";
        }
        return '<span class="evidence-chip" aria-disabled="true" title="評価対象SHAが不明、または安全なURLではないためリンクしません。">' + escapeHtml(label) + "</span>";
      }).join("") +
      "</span>"
    );
  }

  function renderExternalLink(url, label) {
    var safe = core.sanitizeHttpsUrl(url);
    if (!safe) return '<span class="muted">リンクなし</span>';
    return '<a href="' + escapeHtml(safe) + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(label || "開く") + "</a>";
  }

  function renderTable(headers, rows, options) {
    var opts = options || {};
    var head = headers.map(function (h) { return '<th scope="col">' + h + "</th>"; }).join("");
    var body = rows.length
      ? rows.map(function (cells) {
          return "<tr>" + cells.map(function (cell) { return "<td>" + cell + "</td>"; }).join("") + "</tr>";
        }).join("")
      : '<tr><td colspan="' + headers.length + '"><div class="empty">' + escapeHtml(opts.empty || "該当する項目はありません。") + "</div></td></tr>";
    var labelAttr = opts.label ? ' role="region" aria-label="' + escapeHtml(opts.label) + '" tabindex="0"' : "";
    return (
      '<div class="table-wrap"' + labelAttr + ">" +
      "<table>" +
      (opts.caption ? "<caption>" + escapeHtml(opts.caption) + "</caption>" : "") +
      "<thead><tr>" + head + "</tr></thead><tbody>" + body + "</tbody></table>" +
      "</div>"
    );
  }

  function panelHead(title, note, tools) {
    return (
      '<div class="panel-head">' +
        '<div><h2 class="panel-title">' + escapeHtml(title) + "</h2>" +
        (note ? '<p class="panel-note">' + note + "</p>" : "") + "</div>" +
        (tools ? '<div class="panel-tools">' + tools + "</div>" : "") +
      "</div>"
    );
  }

  function provenanceStatusText(prov) {
    if (prov.status === "consistent") return "最新HEADと一致";
    if (prov.status === "dashboard-only") return "製品コード変更なし";
    if (prov.status === "stale") return "評価の更新を検討";
    if (prov.status === "mismatch") return "対象SHAの不一致あり";
    if (prov.status === "unavailable") return "対象SHAを取得不能";
    return "不明";
  }

  function provenanceTone(prov) {
    if (prov.status === "consistent") return "ok";
    if (prov.status === "dashboard-only") return "info";
    if (prov.status === "unavailable") return "warn";
    return "warn";
  }

  function showError(message) {
    state.errorMessage = message;
    var host = document.getElementById("status-host");
    if (host) host.innerHTML = notice("alert", "読み込み・表示エラー", message);
  }

  function notice(tone, title, detail) {
    return (
      '<div class="notice" data-tone="' + escapeHtml(tone) + '" role="status">' +
      '<span class="notice-title">' + escapeHtml(title) + "</span>" +
      (detail ? "<span>" + escapeHtml(detail) + "</span>" : "") +
      "</div>"
    );
  }

  /* ------------------------------------------------------------------ *
   * Context
   * ------------------------------------------------------------------ */

  function computeAxisProgress(evaluation, progress) {
    var rules = (evaluation && evaluation.scoringRules) || {};
    var impl = rules.implementationWeights || {};
    var ver = rules.verificationWeights || {};
    var acc = rules.acceptanceWeights || {};
    var items = asArray(evaluation && evaluation.featureComparison);
    var verSum = 0;
    var accSum = 0;
    var counted = 0;
    for (var i = 0; i < items.length; i += 1) {
      var item = items[i] || {};
      if (String(item.implementationStatus) === "保留・対象外") continue;
      counted += 1;
      verSum += Object.prototype.hasOwnProperty.call(ver, item.verificationStatus) ? ver[item.verificationStatus] : 0;
      accSum += Object.prototype.hasOwnProperty.call(acc, item.deviceAcceptanceStatus) ? acc[item.deviceAcceptanceStatus] : 0;
    }
    var denom = counted || progress.inScopeItems || 0;
    return {
      implementation: progress.prototypeCompletionPct,
      verification: denom ? Math.round((verSum / denom) * 1000) / 10 : null,
      acceptance: denom ? Math.round((accSum / denom) * 1000) / 10 : null,
    };
  }

  function buildContext(data) {
    var meta = data.meta || {};
    var mech = data.mechanical || {};
    var evaluation = data.evaluation || {};
    var progress = core.computeProgress(evaluation);
    var tests = core.computeTestSummary(mech.nextCodebase);
    var ci = core.resolveCiStatus(mech, meta);
    var provenance = core.buildProvenance(mech, evaluation, meta);
    var ownerWork = core.summarizeOwnerWork(evaluation);
    var nextActions = core.summarizeNextActions(evaluation, 3);
    var repoUrl = core.sanitizeGithubRepoUrl(meta.repoUrl) || "";
    var evidenceRef = isPinnedRef(evaluation.evaluatedCommitSha) ? evaluation.evaluatedCommitSha : null;
    var diff = state.baseline ? core.diffSnapshots(state.baseline, data) : null;
    return {
      data: data,
      meta: meta,
      mech: mech,
      git: mech.git || {},
      github: mech.github || {},
      mechanical: mech,
      evaluation: evaluation,
      exec: evaluation.executiveSummary || {},
      progress: progress,
      axes: computeAxisProgress(evaluation, progress),
      tests: tests,
      ci: ci,
      provenance: provenance,
      ownerWork: ownerWork,
      nextActions: nextActions,
      repoUrl: repoUrl,
      branch: meta.targetBranch || "next-native-editor",
      evidenceRef: evidenceRef,
      formulaExplanation: core.buildFormulaExplanation(evaluation, progress),
      diff: diff,
      baseline: state.baseline,
    };
  }

  /* ------------------------------------------------------------------ *
   * Overview
   * ------------------------------------------------------------------ */

  function buildRail(ctx) {
    var rows = [];
    rows.push({
      label: "CI（最新HEAD）",
      tone: ciTone(ctx.ci),
      value: ctx.ci.label,
      sub: "対象HEAD " + ctx.ci.targetShortSha + " · " + (ctx.ci.targetSource || "取得不能"),
    });
    var acc = ctx.progress.acceptance;
    rows.push({
      label: "実機受け入れ",
      tone: acc.passed > 0 ? "ok" : (acc.failed > 0 ? "alert" : "warn"),
      value: acc.passed + " / " + acc.totalItems + " 合格",
      sub: "未測定 " + acc.unmeasured + " · 不合格 " + acc.failed + " · 対象外 " + acc.outOfScope,
    });
    rows.push({
      label: "自動テスト",
      tone: ctx.tests.available ? "info" : "muted",
      value: ctx.tests.available ? formatNumber(ctx.tests.testAnnotations) + " @Test" : "取得不能",
      sub: ctx.tests.available ? "next/ のソース集計（実行結果ではない）" : (ctx.tests.reason || "next/ の集計なし"),
    });
    rows.push({
      label: "定性評価",
      tone: provenanceTone(ctx.provenance),
      value: ctx.provenance.evaluationShortSha,
      sub: formatDateJst(ctx.evaluation.evaluatedAt) + " · " + provenanceStatusText(ctx.provenance),
    });
    return (
      '<div class="status-rail" role="group" aria-label="主要な状態">' +
      rows.map(function (row) {
        return (
          '<div class="rail-row">' +
            '<span class="rail-label"><span class="dot" data-tone="' + escapeHtml(row.tone) + '"></span>' + escapeHtml(row.label) + "</span>" +
            '<span class="rail-value">' + escapeHtml(row.value) + "</span>" +
            '<span class="rail-sub">' + escapeHtml(row.sub) + "</span>" +
          "</div>"
        );
      }).join("") +
      "</div>"
    );
  }

  function buildScoreboard(ctx) {
    var p = ctx.progress;
    var total = p.totalCatalogItems || 0;
    var segments = [
      { id: "実装済み", seg: "done", label: "実装済み" },
      { id: "試作実装", seg: "proto", label: "試作" },
      { id: "部分実装", seg: "partial", label: "部分" },
      { id: "未着手", seg: "todo", label: "未着手" },
      { id: "保留・対象外", seg: "parked", label: "保留・対象外" },
    ];
    var split = segments.map(function (s) {
      var n = p.statusBreakdown[s.id] || 0;
      var width = total ? (n / total) * 100 : 0;
      return n > 0 ? '<span data-seg="' + s.seg + '" style="width:' + width.toFixed(2) + '%" title="' + escapeHtml(s.label + " " + n + " 件") + '"></span>' : "";
    }).join("");
    var legend = segments.filter(function (s) { return (p.statusBreakdown[s.id] || 0) > 0; }).map(function (s) {
      return '<li><span class="dot" data-tone="' + s.seg + '"></span>' + escapeHtml(s.label) + " <b>" + escapeHtml(p.statusBreakdown[s.id] || 0) + "</b></li>";
    }).join("");
    var axes = ctx.axes;
    var axisRow = function (label, value) {
      var n = core.finiteNumber(value);
      var width = n === null ? 0 : Math.max(0, Math.min(100, n));
      return (
        '<li class="axis-row">' +
          "<span>" + escapeHtml(label) + "</span>" +
          '<span class="bar"><span style="width:' + width.toFixed(2) + '%"></span></span>' +
          "<b>" + escapeHtml(formatPct(value)) + "</b>" +
        "</li>"
      );
    };
    return (
      '<div class="scoreboard">' +
        '<div class="score">' +
          '<div class="score-head"><span class="score-label">実装到達度</span><span class="score-note">対象内 ' + escapeHtml(p.inScopeItems) + " 項目の重み付き平均</span></div>" +
          '<div class="score-value">' + escapeHtml(formatPct(p.prototypeCompletionPct).replace("%", "")) + '<span class="unit">%</span></div>' +
          '<div class="bar"><span style="width:' + Math.max(0, Math.min(100, core.finiteNumber(p.prototypeCompletionPct) || 0)) + '%"></span></div>' +
          '<div class="split-bar" role="img" aria-label="' + escapeHtml("実装状態の内訳 " + legend.replace(/<[^>]+>/g, " ")) + '">' + split + "</div>" +
          '<ul class="legend">' + legend + "</ul>" +
        "</div>" +
        '<div class="score">' +
          '<div class="score-head"><span class="score-label">製品品質</span><span class="score-note">実装 30 · 検証 30 · 実機 40</span></div>' +
          '<div class="score-value">' + escapeHtml(formatPct(p.productReadinessPct).replace("%", "")) + '<span class="unit">%</span></div>' +
          '<div class="bar"><span data-tone="prod" style="width:' + Math.max(0, Math.min(100, core.finiteNumber(p.productReadinessPct) || 0)) + '%"></span></div>' +
          '<ul class="axis-list">' +
            axisRow("実装", axes.implementation) +
            axisRow("自動検証", axes.verification) +
            axisRow("実機", axes.acceptance) +
          "</ul>" +
        "</div>" +
      "</div>"
    );
  }

  function buildRoadmap(ctx) {
    var phases = asArray(ctx.evaluation.phases);
    var cells = phases.map(function (p, index) {
      var name = String(p.name || "");
      var parts = name.split("：");
      var code = parts.length > 1 ? parts[0] : "Phase " + index;
      var label = parts.length > 1 ? parts.slice(1).join("：") : name;
      var tone = toneForStatus(ctx.data, p.status);
      var done = asArray(p.completed).length;
      var rest = asArray(p.remaining).length;
      return (
        '<li class="phase">' +
          '<span class="phase-top"><span class="phase-index">' + escapeHtml(code) + "</span></span>" +
          '<span class="phase-name" title="' + escapeHtml(name) + '">' + escapeHtml(label) + "</span>" +
          '<span class="phase-state"><span class="dot" data-tone="' + tone + '"></span>' + escapeHtml(p.status) + "</span>" +
          '<span class="phase-counts">済 ' + escapeHtml(done) + " · 残 " + escapeHtml(rest) + "</span>" +
        "</li>"
      );
    }).join("");
    return (
      '<div class="roadmap-block">' +
        '<div class="block-head"><h2 class="block-title">開発ロードマップ</h2>' +
          '<span class="block-note">公式 Phase 0–5 · 進捗率はフェーズ完了率ではありません</span></div>' +
        '<ol class="roadmap">' + (cells || '<li class="empty">フェーズ情報がありません。</li>') + "</ol>" +
      "</div>"
    );
  }

  function buildPhaseDetails(ctx) {
    var phases = asArray(ctx.evaluation.phases);
    var details = phases.map(function (p) {
      return (
        "<dt>" + escapeHtml(p.name) + " " + statusLabel(ctx.data, p.status) + "</dt>" +
        "<dd>" + escapeHtml(p.purpose || "") +
          '<span class="sub">完了条件: ' + escapeHtml(p.exitCriteria || "未記録") +
          " · 依存: " + escapeHtml(asArray(p.dependencies).length ? p.dependencies.join(", ") : "なし") + "</span>" +
        "</dd>"
      );
    }).join("");
    return phases.length
      ? '<details><summary>Phase の目的と完了条件</summary><div class="detail-body"><dl>' + details + "</dl></div></details>"
      : "";
  }

  function buildNext(ctx) {
    var actions = ctx.nextActions;
    var issues = asArray(ctx.evaluation.remainingIssues);
    var ownerCount = 0;
    var agentCount = 0;
    var official = 0;
    issues.forEach(function (it) {
      if (it.ownerType === "owner_device") ownerCount += 1;
      if (it.ownerType === "agent" || it.ownerType === "both") agentCount += 1;
      if (it.origin === "roadmap_official") official += 1;
    });
    var rows = actions.map(function (a, index) {
      var tone = priorityTone(a.priority);
      var href = "#issues";
      return (
        '<li><a class="next-item" href="' + href + '" data-issue="' + escapeHtml(a.id || "") + '">' +
          '<span class="next-index">' + String(index + 1).padStart(2, "0") + "</span>" +
          '<span class="dot" data-tone="' + tone + '"></span>' +
          '<span class="next-title">' + escapeHtml(a.title) + "</span>" +
          '<span class="next-meta">' +
            '<span class="next-owner"><span class="dot" data-tone="' + (a.ownerType === "owner_device" ? "warn" : "info") + '"></span>' + escapeHtml(ownerLabel(a.ownerType)) + "</span>" +
            '<span class="next-pri">' + escapeHtml(a.priority) + "</span>" +
          "</span>" +
        "</a></li>"
      );
    }).join("");
    var delta = buildDelta(ctx);
    return (
      '<div class="next-block">' +
        '<div>' +
          '<div class="block-head"><h2 class="block-title">次に取り組む 3 件</h2>' +

        '<div class="next-side">' +
          '<div class="side-stat"><span>残課題</span><b>' + escapeHtml(issues.length) + "</b></div>" +
          '<div class="side-stat"><span>オーナー実機・判断</span><b>' + escapeHtml(ownerCount) + "</b></div>" +
          '<div class="side-stat"><span>エージェント実施可</span><b>' + escapeHtml(agentCount) + "</b></div>" +
          '<div class="side-stat"><span>公式ロードマップ由来</span><b>' + escapeHtml(official) + " / " + escapeHtml(issues.length) + "</b></div>" +
          '<a class="side-link" href="#issues">課題と完了条件をすべて見る →</a>' +
        "</div>" +
      "</div>"
    );
  }

  function buildDelta(ctx) {
    var diff = ctx.diff;
    if (!diff || !diff.available) return "";
    var bits = [];
    var counts = diff.counts || {};
    if (counts.featuresAdded) bits.push("機能 <b>+" + counts.featuresAdded + "</b>");
    if (counts.featureStatusChanges) bits.push("機能状態 <b>" + counts.featureStatusChanges + "</b> 件変化");
    if (counts.acceptanceChanges) bits.push("実機結果 <b>" + counts.acceptanceChanges + "</b> 件変化");
    if (counts.issuesAdded) bits.push("課題 <b>+" + counts.issuesAdded + "</b>");
    if (counts.issuesRemoved) bits.push("課題 <b>−" + counts.issuesRemoved + "</b>");
    if (!bits.length && diff.hasChanges) bits.push("SHA・CI が変化");
    if (!bits.length) return '<p class="delta-line">前回表示からの変化なし</p>';
    return (
      '<p class="delta-line">前回表示から: ' + bits.join(" ・ ") +
      ' <a href="#evidence">差分の詳細</a></p>'
    );
  }

  function buildOverview(ctx) {
    var exec = ctx.exec;
    var head = splitHeadline(exec.primaryDevelopmentPhase);
    var critical = asArray(exec.criticalSafetyAlerts).filter(function (a) { return a.severity === "critical"; })[0];
    var prov = ctx.provenance;
    return (
      '<div class="overview-hero">' +
        '<div>' +
          '<div class="eyebrow"><span class="eyebrow-dot" aria-hidden="true"></span>' +
            "PR #" + escapeHtml(ctx.meta.prNumber || "不明") + " · " + escapeHtml(ctx.branch) +
            " · HEAD " + escapeHtml(prov.targetShortSha) + "</div>" +
          '<h1 class="hero-title">' + escapeHtml(head.lead) + "</h1>" +
          '<p class="hero-sub">' + (head.rest ? escapeHtml(head.rest) + " " : "") +
            (critical ? '<strong>最大の未確認:</strong> ' + escapeHtml(critical.title) + ' <a href="#acceptance">実機検証へ</a>' : "") +
          "</p>" +
          '<div class="hero-foot">' +
            "<span>データ生成 " + escapeHtml(formatDateJst(ctx.meta.generatedAt)) + "</span>" +
            "<span>定性評価 " + escapeHtml(formatDateJst(ctx.evaluation.evaluatedAt)) + " · " + escapeHtml(prov.evaluationShortSha) + "</span>" +
            '<a href="#evidence">根拠と対象SHA</a>' +
          "</div>" +
        "</div>" +
        buildRail(ctx) +
      "</div>" +
      buildScoreboard(ctx) +
      buildRoadmap(ctx) +
      buildNext(ctx) +
      buildPhaseDetails(ctx)
    );
  }

  /* ------------------------------------------------------------------ *
   * Issues
   * ------------------------------------------------------------------ */

  function buildIssuesPanel(ctx) {
    var issues = asArray(ctx.evaluation.remainingIssues);
    var ownerCount = ctx.ownerWork.counts.owner_device;
    var agentCount = ctx.ownerWork.counts.agent + ctx.ownerWork.counts.both;
    return (
      panelHead(
        "残課題",
        "公式ロードマップ由来と新規提案を区別。優先度・順序・依存関係はエージェント推定で、同順は並行グループです。",
        '<span class="muted small">オーナー ' + escapeHtml(ownerCount) + " · エージェント " + escapeHtml(agentCount) + "</span>"
      ) +
      '<p class="callout"><strong>公式決定と推定の区別:</strong> 「公式」タグは公式文書に由来します。P0〜P3、推奨順序、依存関係、「並行可」はエージェントの推定であり、公式の決定事項ではありません。</p>' +

        '<span class="filter-count" id="iss-count"></span>' +
      "</div>" +
      '<div class="table-wrap" role="region" aria-label="残課題一覧" tabindex="0"><table>' +

  /* ------------------------------------------------------------------ *
   * Features
   * ------------------------------------------------------------------ */

  function catalogScope(item) {
    if (item.implementationStatus === "保留・対象外") return "対象外";
    if (item.disposition === "保留") return "将来検討（保留）";
    return "対象内";
  }

  function buildFeaturesPanel(ctx) {
    var items = asArray(ctx.evaluation.featureComparison);
    var categories = Array.from(new Set(items.map(function (i) { return i.category; })));
    var statuses = Array.from(new Set(items.map(function (i) { return i.implementationStatus; })));
    var p = ctx.progress;
    return (
      panelHead(
        "機能比較",
        "第一世代との対応、実装・自動検証・実機受け入れを独立表示。根拠リンクは評価対象SHAに固定。",

      ) +
      '<ul class="scope-line">' +
        "<li>カタログ <b>" + escapeHtml(p.totalCatalogItems) + "</b></li>" +

      "</div></details>"
    );
  }

  /* ------------------------------------------------------------------ *
   * Acceptance
   * ------------------------------------------------------------------ */

  function buildAcceptancePanel(ctx) {
    var ap = ctx.evaluation.acceptanceAndPerformance || {};
    var accRows = asArray(ap.acceptanceRows);
    var perfRows = asArray(ap.performanceRows);
    var groups = Array.from(new Set(accRows.map(function (r) { return r.group; })));
    var acc = ctx.progress.acceptance;
    var total = acc.totalItems || 0;
    var seg = function (n, tone) {
      var width = total ? (n / total) * 100 : 0;
      return n > 0 ? '<span data-seg="' + tone + '" style="width:' + width.toFixed(2) + '%"></span>' : "";
    };
    var perfTableRows = perfRows.map(function (p) {
      return [
        "<strong>" + escapeHtml(p.metric) + "</strong>" + evidenceChips(ctx, p.evidence),
        escapeHtml(p.g1Value),
        escapeHtml(p.g2Value),
        p.comparable ? toneStatus("ok", "同条件比較可") : toneStatus("muted", "同条件比較不可"),
        escapeHtml(p.condition),
      ];
    });
    return (
      panelHead(
        "実機検証",
        "実機受け入れは明細から再集計。自動テストの結果は合格へ転記しません。",
        '<span class="muted small">' + escapeHtml(total) + " 項目</span>"
      ) +
      '<div class="acc-summary">' +
        '<div class="acc-cell"><div class="acc-label">合格</div><div class="acc-value">' + escapeHtml(acc.passed) + ' <small>/ ' + escapeHtml(total) + "</small></div></div>" +
        '<div class="acc-cell"><div class="acc-label">未測定</div><div class="acc-value">' + escapeHtml(acc.unmeasured) + "</div></div>" +
        '<div class="acc-cell"><div class="acc-label">不合格</div><div class="acc-value">' + escapeHtml(acc.failed) + "</div></div>" +
        '<div class="acc-cell"><div class="acc-label">対象外</div><div class="acc-value">' + escapeHtml(acc.outOfScope) + "</div></div>" +
      "</div>" +
      '<div class="split-bar" role="img" aria-label="' + escapeHtml("実機受け入れの内訳 合格 " + acc.passed + " / 未測定 " + acc.unmeasured + " / 不合格 " + acc.failed + " / 対象外 " + acc.outOfScope) + '">' +
        seg(acc.passed, "done") + seg(acc.failed, "partial") + seg(acc.unmeasured, "todo") + seg(acc.outOfScope, "parked") +
      "</div>" +
      '<ul class="legend" style="margin-bottom:18px;">' +
        '<li><span class="dot" data-tone="done"></span>合格 <b>' + escapeHtml(acc.passed) + "</b></li>" +
        '<li><span class="dot" data-tone="partial"></span>不合格 <b>' + escapeHtml(acc.failed) + "</b></li>" +
        '<li><span class="dot" data-tone="todo"></span>未測定 <b>' + escapeHtml(acc.unmeasured) + "</b></li>" +
        '<li><span class="dot" data-tone="parked"></span>対象外 <b>' + escapeHtml(acc.outOfScope) + "</b></li>" +
      "</ul>" +
      '<div class="filter-bar">' +
        '<select id="acc-group" aria-label="受け入れ分類"><option value="">すべての分類</option>' +
          groups.map(function (g) { return '<option value="' + escapeHtml(g) + '">' + escapeHtml(g) + "</option>"; }).join("") +
        "</select>" +
        '<input type="search" id="acc-search" placeholder="IDや試験内容で絞り込み…" aria-label="受け入れ項目を検索">' +
        '<span class="filter-count" id="acc-count"></span>' +
      "</div>" +
      '<div class="table-wrap" role="region" aria-label="実機受け入れ一覧" tabindex="0"><table>' +
        '<thead><tr><th scope="col">ID</th><th scope="col">分類</th><th scope="col">試験項目</th><th scope="col">第一世代</th><th scope="col">第二世代</th><th scope="col">関連自動テスト（代替不可）</th></tr></thead>' +
        '<tbody id="acc-tbody"></tbody></table></div>' +
      '<details><summary>性能比較（同条件実測の可否つき）</summary><div class="detail-body">' +
        renderTable(["計測項目", "第一世代", "第二世代", "同条件比較", "測定条件・注記"], perfTableRows, { label: "性能比較" }) +
      "</div></details>"
    );
  }

  /* ------------------------------------------------------------------ *
   * CI and history
   * ------------------------------------------------------------------ */

  function buildCiPanel(ctx) {
    var ci = ctx.ci;
    var workflows = asArray(ci.workflows).map(function (wf) {
      return [
        "<strong>" + escapeHtml(wf.name) + "</strong>",
        toneStatus(wf.tone || "muted", wf.label),
        escapeHtml(wf.source),
        "<code>" + escapeHtml(wf.shortSha) + "</code>",
        renderExternalLink(wf.runUrl, "ログ"),
      ];
    });
    var oldRows = asArray(ci.oldHeadSuccesses).map(function (run) {
      return [
        escapeHtml(run.workflowName),
        "<code>" + escapeHtml(run.shortSha) + "</code>",
        escapeHtml(formatDateJst(run.updatedAt)),
        renderExternalLink(run.runUrl, "ログ"),
      ];
    });
    var highlights = ctx.mechanical.ciHighlights || null;
    var highlightRows = [];
    if (highlights && highlights.nextNativeLatest) {
      var n = highlights.nextNativeLatest;
      highlightRows.push([
        "Next Native 最終成功",
        "<code>" + escapeHtml(shortSha(n.headSha)) + "</code>",
        "Swift Testing " + escapeHtml(formatNumber(n.swiftTestingTests)) + "件 / " + escapeHtml(formatNumber(n.swiftTestingSuites)) + " suites / 受け入れ合成原稿 " + escapeHtml(formatNumber(n.acceptanceFixturesVerified)) + "件",

    if (highlights && highlights.qualityLatestOnPr71) {
      var q = highlights.qualityLatestOnPr71;
      highlightRows.push([
        "Quality 最終成功",
        "<code>" + escapeHtml(shortSha(q.headSha)) + "</code>",
        "frontend " + escapeHtml(formatNumber(q.frontendTests)) + "件 / Rust " + escapeHtml(formatNumber(q.rustPassed)) + " / G1 Swift " + escapeHtml(formatNumber(q.g1SwiftXCTestPassed)) + "+" + escapeHtml(formatNumber(q.g1SwiftTestingPassed)),
        renderExternalLink(q.url, "ログ"),
      ]);
    }
    return (
      panelHead(
        "CI",
        "最新HEADに紐づくCIだけを判定。旧HEADの成功は最新の成功として扱いません。",
        '<span class="muted small">HEAD <code>' + escapeHtml(ci.targetShortSha) + "</code></span>"
      ) +
      '<div class="ci-verdict">' +
        toneStatus(ci.tone || "muted", ci.label) +
        '<p class="ci-reason">' + escapeHtml(ci.reason) + "</p>" +
        '<p class="sub">対象HEAD <code>' + escapeHtml(ci.targetShortSha) + "</code> · " + escapeHtml(ci.targetSource || "取得不能") +
          " · 取得 " + escapeHtml(formatDateJst(ci.capturedAt)) + "</p>" +
      "</div>" +
      renderTable(["ワークフロー", "状態", "判定ソース", "対象HEAD", "リンク"], workflows, { label: "最新HEADのCI状態", empty: "最新HEADのCI結果を取得できません。" }) +
      (oldRows.length
        ? '<details><summary>旧HEADの成功記録（' + escapeHtml(ci.oldHeadSuccessCount) + " 件）</summary><div class=\"detail-body\">" +
          renderTable(["ワークフロー", "HEAD", "更新日時", "リンク"], oldRows, { label: "旧HEADの成功記録" }) + "</div></details>"
        : "") +
      (highlightRows.length
        ? '<details><summary>CI 最終成功時の記録（最新HEADの状態ではない）</summary><div class="detail-body">' +
          renderTable(["記録", "HEAD", "詳細", "リンク"], highlightRows, { label: "CI最終成功時の詳細" }) +
          '<p class="sub">' + escapeHtml(highlights.note || "") + "</p></div></details>"
        : "")
    );
  }

  function buildHistoryPanel(ctx) {

      ) +

      '<details><summary>全コミット履歴（' + escapeHtml(commits.length) + " 件）</summary><div class=\"detail-body\">" +

      "</div></details>"
    );
  }

  /* ------------------------------------------------------------------ *
   * Evidence
   * ------------------------------------------------------------------ */

  function buildEvidencePanel(ctx) {
    var prov = ctx.provenance;
    var discs = asArray(ctx.evaluation.discrepancies);
    var states = asArray(ctx.evaluation.scoringRules && ctx.evaluation.scoringRules.states);
    var mods = asArray(ctx.mechanical.nextCodebase && ctx.mechanical.nextCodebase.modules);
    var shaRows = [
      [
        "データ対象HEAD",
        "<code>" + escapeHtml(prov.targetSha || "不明") + "</code>",
        escapeHtml(formatDateJst(prov.generatedAt)),
        escapeHtml(prov.targetSource || "取得不能"),
        toneStatus("ok", "基準"),
      ],
      [
        "Git HEAD",
        "<code>" + escapeHtml(prov.gitHead || "不明") + "</code>",
        escapeHtml(formatDateJst(ctx.git.capturedAt)),
        escapeHtml(ctx.git.fetchStatus === "ok" ? "git ref" : "取得不能"),
        prov.matches.githubVsGit === null ? toneStatus("muted", "比較不能") : (prov.matches.githubVsGit ? toneStatus("ok", "GitHubと一致") : toneStatus("warn", "不一致")),
      ],
      [
        "GitHub PR head",
        "<code>" + escapeHtml(prov.githubHead || "不明") + "</code>",
        escapeHtml(formatDateJst(ctx.github.capturedAt)),
        escapeHtml(ctx.github.fetchStatus === "ok" ? "gh pr view 71" : "取得不能"),

      ],
      [

        "<code>" + escapeHtml(prov.sourceSha || "不明") + "</code>",

      ],
      [
        "定性評価 対象SHA",
        "<code>" + escapeHtml(prov.evaluationSha || "不明") + "</code>",
        escapeHtml(formatDateJst(prov.evaluatedAt)),
        escapeHtml(prov.evaluation.impact === "dashboard_only" ? "製品コード変更なし" : prov.evaluation.impact === "code_changed" ? "コード変更あり" : prov.evaluation.headMoved ? "差分範囲不明" : "最新HEADと一致"),

      panelHead(

        "<p>" + escapeHtml(ctx.formulaExplanation) + "</p>" +

      renderTable(["重要度", "論点", "記述 A", "記述 B（実態）", "影響と根拠"], discRows, { label: "矛盾・乖離" }) +

      '<details><summary>JSON検証・URL安全性・読み込み時の挙動</summary><div class="detail-body">' +
        '<p>スキーマ <code>' + escapeHtml(ctx.meta.schemaVersion || "不明") + "</code> · 生成器 <code>" + escapeHtml(ctx.meta.generatorVersion || "不明") + "</code> · 表示データ " + escapeHtml(state.sourceLabel) + "</p>" +
        "<p>読み込み時に必須構造・日時・GitHub URL・証拠パスの安全性を検証します。失敗時は既存の表示を保持し、エラーだけを通知します。外部リンクは https のみ、根拠パスは評価対象SHAに固定します。</p>" +
        '<div class="panel-label" style="margin-top:8px;">入力データの検証警告</div>' +

          ? '<ul class="warn-list">' + state.schemaWarnings.slice(0, 20).map(function (w) { return "<li><code>" + escapeHtml(w.path) + "</code>: " + escapeHtml(w.message) + "</li>"; }).join("") + "</ul>"
          : '<p class="muted">検証警告はありません。</p>') +
      "</div></details>"
    );

  function buildDiff(ctx) {
    var diff = ctx.diff;
    if (!diff || !diff.available) {
      return '<p class="muted">比較できる前回データがありません。JSONを読み込むと、その時点の表示を比較基準として保持します。</p>';
    }
    function cell(v, suffix) {
      if (!v) return "—";
      if (v.delta === null || v.delta === undefined) return "不明";
      var sign = v.delta > 0 ? "+" : "";
      return (v.delta === 0 ? "変化なし" : sign + v.delta + (suffix || ""));
    }
    function pair(v) {
      if (!v) return "—";
      var from = v.from === null || v.from === undefined ? "不明" : v.from;
      var to = v.to === null || v.to === undefined ? "不明" : v.to;
      return escapeHtml(from) + " → " + escapeHtml(to);
    }
    var rows = [
      ["実装到達度", pair(diff.progress.prototypePct) + "%", cell(diff.progress.prototypePct, "pt")],
      ["製品品質", pair(diff.progress.productPct) + "%", cell(diff.progress.productPct, "pt")],
      ["カタログ項目", pair(diff.progress.totalCatalogItems), cell(diff.progress.totalCatalogItems)],
      ["実機合格", pair(diff.progress.acceptancePassed), cell(diff.progress.acceptancePassed)],
      ["実機未測定", pair(diff.progress.acceptanceUnmeasured), cell(diff.progress.acceptanceUnmeasured)],
      ["CI", escapeHtml(diff.ci.fromLabel) + " → " + escapeHtml(diff.ci.toLabel), diff.ci.changed ? "変化" : "変化なし"],
      ["データ対象HEAD", escapeHtml(shortSha(diff.head.from)) + " → " + escapeHtml(shortSha(diff.head.to)), diff.head.changed ? "変化" : "変化なし"],
      ["評価対象SHA", escapeHtml(shortSha(diff.evaluation.from)) + " → " + escapeHtml(shortSha(diff.evaluation.to)), diff.evaluation.changed ? "変化" : "変化なし"],
    ];
    var counts = diff.counts || {};
    var detail = [];
    diff.features.added.slice(0, 10).forEach(function (item) { detail.push("追加機能: " + item.name); });
    diff.features.removed.slice(0, 10).forEach(function (item) { detail.push("削除機能: " + item.name); });
    diff.features.changed.slice(0, 15).forEach(function (item) { detail.push(item.name + " / " + item.label + ": " + item.from + " → " + item.to); });
    diff.acceptance.changed.slice(0, 15).forEach(function (item) { detail.push(item.id + " " + item.title + ": " + item.fromStatus + " → " + item.toStatus); });
    diff.issues.added.slice(0, 10).forEach(function (item) { detail.push("追加課題: " + item.title); });
    diff.issues.removed.slice(0, 10).forEach(function (item) { detail.push("解消課題: " + item.title); });
    return (
      '<p>比較基準: ' + escapeHtml(formatDateJst(diff.previousGeneratedAt)) + " のデータ → 現在の表示" +
        (diff.hasChanges ? "（変更 " + escapeHtml(counts.total || 0) + " 件）" : "（変更なし）") +
        ' <button type="button" class="btn" id="diff-clear" style="margin-left:8px;">比較基準を解除</button></p>' +
      renderTable(["指標", "前回 → 現在", "差"], rows, { label: "前回表示との差分" }) +
      (detail.length
        ? '<ul class="warn-list">' + detail.map(function (line) { return "<li>" + escapeHtml(line) + "</li>"; }).join("") + "</ul>"
        : "")
    );
  }

  function renderAll() {
    if (!core) {
      showError("共通ロジック (dashboard-core.cjs) が埋め込まれていません。generate.mjs を実行してください。");
      return;
    }
    state.errorMessage = null;
    try {
      var ctx = buildContext(state.data);
      var panels = {
        overview: buildOverview(ctx),
        issues: buildIssuesPanel(ctx),
        features: buildFeaturesPanel(ctx),
        safety: buildSafetyPanel(ctx),
        acceptance: buildAcceptancePanel(ctx),

      };

      });

      bindControls(ctx);
      writeHistory(state.baseline, state.data);

      showError("表示の更新に失敗しました: " + (err && err.message ? err.message : "不明なエラー"));

  function renderStatusHost() {
    var host = document.getElementById("status-host");
    if (!host) return;
    var parts = [];
    if (state.errorMessage) parts.push(notice("alert", "読み込み・表示エラー", state.errorMessage));
    if (state.loadMessage) parts.push(notice("ok", "読み込み完了", state.loadMessage));
    if (state.schemaWarnings.some(function (w) { return w.path !== "evaluation.evaluatedCommitSha"; })) {
      parts.push(notice("warn", "データ検証警告", "詳細は「根拠」タブを確認してください。"));
    }
    host.innerHTML = parts.join("");
  }

  /* ------------------------------------------------------------------ *
   * Tabs
   * ------------------------------------------------------------------ */

  function activateTab(name, options) {
    var opts = options || {};
    if (TAB_NAMES.indexOf(name) === -1) name = "overview";
    state.activeTab = name;
    TAB_NAMES.forEach(function (tabName) {
      var tab = document.getElementById("tab-" + tabName);
      var panel = document.getElementById("panel-" + tabName);
      var selected = tabName === name;
      if (tab) {
        tab.setAttribute("aria-selected", selected ? "true" : "false");
        tab.tabIndex = selected ? 0 : -1;
      }
      if (panel) panel.hidden = !selected;
    });
    if (opts.focus) {
      var activeTab = document.getElementById("tab-" + name);
      if (activeTab) activeTab.focus();
    }
    if (opts.updateHash !== false) {
      try {
        history.replaceState(null, "", "#" + name);
      } catch (_) {
        /* file:// 等で replaceState が使えない場合は無視する。 */
      }
    }
  }

  function initTabs() {
    var tabs = Array.prototype.slice.call(document.querySelectorAll('[role="tab"]'));
    tabs.forEach(function (tab, index) {
      tab.addEventListener("click", function () {
        activateTab(TAB_NAMES[index]);
      });
      tab.addEventListener("keydown", function (event) {
        var next = null;
        if (event.key === "ArrowRight") next = (index + 1) % tabs.length;
        else if (event.key === "ArrowLeft") next = (index - 1 + tabs.length) % tabs.length;
        else if (event.key === "Home") next = 0;
        else if (event.key === "End") next = tabs.length - 1;
        if (next === null) return;
        event.preventDefault();
        activateTab(TAB_NAMES[next], { focus: true });
      });
    });
    window.addEventListener("hashchange", function () {
      var name = location.hash.replace(/^#/, "");
      if (TAB_NAMES.indexOf(name) !== -1) {
        activateTab(name, { updateHash: false });
        window.scrollTo({ top: 0, behavior: "auto" });
      }
    });
    var initial = location.hash.replace(/^#/, "");
    activateTab(TAB_NAMES.indexOf(initial) !== -1 ? initial : "overview", { updateHash: false });
  }

  /* ------------------------------------------------------------------ *
   * Filters
   * ------------------------------------------------------------------ */

  function bindControls(ctx) {
    var clear = document.getElementById("diff-clear");
    if (clear) {
      clear.addEventListener("click", function () {
        state.baseline = null;
        clearStoredHistory();
        state.loadMessage = "比較基準を解除しました。";
        renderAll();
      });
    }

    var items = asArray(ctx.evaluation.featureComparison);
    var search = document.getElementById("cmp-search");
    var category = document.getElementById("cmp-category");
    var status = document.getElementById("cmp-status");
    function updateComparison() {
      var q = (search && search.value || "").trim().toLowerCase();
      var cat = category && category.value || "";
      var st = status && status.value || "";
      var filtered = items.filter(function (item) {
        if (cat && item.category !== cat) return false;
        if (st && item.implementationStatus !== st) return false;
        if (q) {
          var hay = [item.name, item.category, item.g1Status, item.missingParts, asArray(item.evidence).map(function (e) { return e.path || ""; }).join(" ")].join(" ").toLowerCase();
          if (hay.indexOf(q) === -1) return false;
        }
        return true;
      });
      var count = document.getElementById("cmp-count");
      if (count) count.textContent = filtered.length + " / " + items.length + " 件";
      var host = document.getElementById("cmp-groups");
      if (!host) return;
      if (!filtered.length) {
        host.innerHTML = '<div class="empty">一致する機能項目はありません。</div>';
        return;
      }
      var byCat = new Map();
      filtered.forEach(function (item) {
        if (!byCat.has(item.category)) byCat.set(item.category, []);
        byCat.get(item.category).push(item);
      });
      host.innerHTML = Array.from(byCat.entries()).map(function (entry) {
        var catName = entry[0];
        var catItems = entry[1];
        return (
          '<details class="cat-group">' +
            '<summary><span>' + escapeHtml(catName) + '</span><span class="muted small">' + escapeHtml(catItems.length) + " 件</span></summary>" +
            '<div class="cat-body">' +
              renderTable(
                ["機能", "方針", "実装", "自動検証", "実機", "未対応部分・根拠"],
                catItems.map(function (it) {
                  return [
                    "<strong>" + escapeHtml(it.name) + "</strong>" + (it.g1Status ? '<span class="sub">G1: ' + escapeHtml(it.g1Status) + "</span>" : ""),
                    escapeHtml(it.disposition) + '<span class="sub">' + escapeHtml(catalogScope(it)) + "</span>",
                    statusLabel(ctx.data, it.implementationStatus),
                    statusLabel(ctx.data, it.verificationStatus),
                    statusLabel(ctx.data, it.deviceAcceptanceStatus),
                    "<div>" + escapeHtml(it.missingParts) + "</div>" + evidenceChips(ctx, it.evidence),
                  ];
                }),
                { label: catName + "の機能比較" }
              ) +
            "</div>" +
          "</details>"
        );
      }).join("");
    }
    ["cmp-search", "cmp-category", "cmp-status"].forEach(function (id) {
      var el = document.getElementById(id);
      if (!el) return;
      el.addEventListener("input", updateComparison);
      el.addEventListener("change", updateComparison);
    });
    updateComparison();

    var accRows = asArray((ctx.evaluation.acceptanceAndPerformance || {}).acceptanceRows);
    var accGroup = document.getElementById("acc-group");
    var accSearch = document.getElementById("acc-search");
    function updateAcceptance() {
      var g = accGroup && accGroup.value || "";
      var q = (accSearch && accSearch.value || "").trim().toLowerCase();
      var rows = accRows.filter(function (r) {
        if (g && r.group !== g) return false;
        if (q && [r.id, r.group, r.title, r.autoRef, r.g2Result].join(" ").toLowerCase().indexOf(q) === -1) return false;
        return true;
      });
      var count = document.getElementById("acc-count");
      if (count) count.textContent = rows.length + " / " + accRows.length + " 件";
      var body = document.getElementById("acc-tbody");
      if (!body) return;
      body.innerHTML = rows.length ? rows.map(function (r) {
        var note = r.g2Result && r.g2Result !== "未測定" ? '<span class="sub">' + escapeHtml(r.g2Result) + "</span>" : "";
        return "<tr>" +
          "<td><code>" + escapeHtml(r.id) + "</code></td>" +
          "<td>" + escapeHtml(r.group) + "</td>" +
          "<td>" + escapeHtml(r.title) + "</td>" +
          "<td>" + resultBadge(r.g1Result) + "</td>" +
          "<td>" + resultBadge(r.g2Result) + note + "</td>" +
          '<td><code>' + escapeHtml(r.autoRef) + "</code></td></tr>";
      }).join("") : '<tr><td colspan="6"><div class="empty">該当する受け入れ項目はありません。</div></td></tr>';
    }
    if (accGroup) accGroup.addEventListener("change", updateAcceptance);
    if (accSearch) accSearch.addEventListener("input", updateAcceptance);
    updateAcceptance();

    var issues = asArray(ctx.evaluation.remainingIssues);
    var issPriority = document.getElementById("iss-priority");
    var issOwner = document.getElementById("iss-owner");
    var issSearch = document.getElementById("iss-search");
    function updateIssues() {
      var p = issPriority && issPriority.value || "";
      var w = issOwner && issOwner.value || "";
      var q = (issSearch && issSearch.value || "").trim().toLowerCase();
      var rows = issues.filter(function (it) {
        if (p && it.priority !== p) return false;
        if (w && it.ownerType !== w) return false;
        if (q && [it.title, it.summary, it.whyRemaining, it.doneCriteria, asArray(it.relatedRefs).join(" ")].join(" ").toLowerCase().indexOf(q) === -1) return false;
        return true;
      });
      var count = document.getElementById("iss-count");
      if (count) count.textContent = rows.length + " / " + issues.length + " 件";
      var body = document.getElementById("iss-tbody");
      if (!body) return;
      body.innerHTML = rows.length ? rows.map(function (it) {
        var tone = priorityTone(it.priority);
        return "<tr>" +
          '<td><span class="num">#' + escapeHtml(it.recommendedOrder) + "</span><br>" +
            '<span class="status" data-tone="' + tone + '"><span class="dot" data-tone="' + tone + '"></span>' + escapeHtml(it.priority) + "</span>" +
            '<span class="sub">推定順</span></td>' +
          "<td><strong>" + escapeHtml(it.title) + "</strong>" +
            '<span class="sub">' + escapeHtml(it.summary) + "</span>" +
            (it.whyRemaining ? '<span class="sub">理由: ' + escapeHtml(it.whyRemaining) + "</span>" : "") +
            evidenceChips(ctx, it.relatedRefs) + "</td>" +
          "<td>" + escapeHtml(it.doneCriteria) + "</td>" +
          '<td><span class="status"><span class="dot" data-tone="' + (it.ownerType === "owner_device" ? "warn" : "info") + '"></span>' + escapeHtml(ownerLabel(it.ownerType)) + "</span>" +
            '<span class="sub">' + escapeHtml(it.origin === "roadmap_official" ? "公式ロードマップ" : "新規発見（提案）") + "</span>" +
            '<span class="sub">並行: ' + (it.parallelizable ? "可（推定）" : "直列前提（推定）") +
              " · 依存: " + escapeHtml(asArray(it.dependencies).length ? it.dependencies.join(", ") : "なし") + "</span></td></tr>";
      }).join("") : '<tr><td colspan="4"><div class="empty">該当する課題はありません。</div></td></tr>';
    }
    ["iss-priority", "iss-owner", "iss-search"].forEach(function (id) {
      var el = document.getElementById(id);
      if (!el) return;
      el.addEventListener("input", updateIssues);
      el.addEventListener("change", updateIssues);
    });
    updateIssues();

    var commits = asArray(ctx.git.commits);
    var histSearch = document.getElementById("hist-search");
    var histCat = document.getElementById("hist-cat");
    function updateHistory() {
      var q = (histSearch && histSearch.value || "").trim().toLowerCase();
      var cat = histCat && histCat.value || "";
      var list = commits.filter(function (c) {
        if (cat && c.category !== cat) return false;
        if (q && [c.shortSha, c.sha, c.subject, c.category].join(" ").toLowerCase().indexOf(q) === -1) return false;
        return true;
      });
      var count = document.getElementById("hist-count");
      if (count) count.textContent = list.length + " / " + commits.length + " 件";
      var body = document.getElementById("hist-tbody");
      if (!body) return;
      body.innerHTML = list.length ? list.slice().reverse().map(function (c) {
        var link = ctx.repoUrl && isPinnedRef(c.sha)
          ? '<a href="' + escapeHtml(ctx.repoUrl + "/commit/" + c.sha) + '" target="_blank" rel="noopener noreferrer"><code>' + escapeHtml(c.shortSha) + "</code></a>"
          : "<code>" + escapeHtml(c.shortSha) + "</code>";
        return "<tr><td>" + link + "</td>" +
          '<td class="nowrap">' + escapeHtml(c.date) + "</td>" +
          '<td class="muted">' + escapeHtml(c.category) + "</td>" +
          "<td>" + escapeHtml(c.subject) + "</td></tr>";
      }).join("") : '<tr><td colspan="4"><div class="empty">該当するコミットはありません。</div></td></tr>';
    }
    if (histSearch) histSearch.addEventListener("input", updateHistory);
    if (histCat) histCat.addEventListener("change", updateHistory);
    updateHistory();
  }

  /* ------------------------------------------------------------------ *
   * Storage / theme / load
   * ------------------------------------------------------------------ */

  function readEmbeddedData() {
    var el = document.getElementById("dashboard-data");
    if (!el) throw new Error("dashboard-data スクリプト要素がありません。");
    return JSON.parse(el.textContent || "{}");
  }

  function readHistory() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      var parsed = JSON.parse(raw);
      if (!parsed || typeof parsed !== "object") return null;
      var previous = parsed.previous ? core.validateDashboardData(parsed.previous) : null;
      var current = parsed.current ? core.validateDashboardData(parsed.current) : null;
      return {
        previous: previous && previous.ok ? parsed.previous : null,
        current: current && current.ok ? parsed.current : null,
      };
    } catch (_) {
      return null;
    }
  }

  function writeHistory(previous, current) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ previous: previous || null, current: current || null }));
    } catch (_) {
      /* file:// や容量制限では差分なしで継続する。 */
    }
  }

  function clearStoredHistory() {
    try { localStorage.removeItem(STORAGE_KEY); } catch (_) {}
  }

  function initTheme() {
    var saved = "system";
    try { saved = localStorage.getItem("hazakura-next-dashboard-theme") || "system"; } catch (_) {}
    try {
      var queryTheme = new URLSearchParams(window.location.search).get("theme");
      if (queryTheme === "light" || queryTheme === "dark" || queryTheme === "system") saved = queryTheme;
    } catch (_) {}
    applyTheme(saved);
    document.querySelectorAll("[data-theme-choice]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var next = btn.getAttribute("data-theme-choice") || "system";
        applyTheme(next);
        try { localStorage.setItem("hazakura-next-dashboard-theme", next); } catch (_) {}
      });
    });
  }

  function applyTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    document.querySelectorAll("[data-theme-choice]").forEach(function (btn) {
      btn.setAttribute("aria-pressed", btn.getAttribute("data-theme-choice") === theme ? "true" : "false");
    });
  }

  function layoutDebug() {
    try {
      var params = new URLSearchParams(window.location.search);
      if (params.get("debug") !== "layout") return;
      var overflow = document.documentElement.scrollWidth > window.innerWidth + 1;
      var offenders = [];
      var all = document.querySelectorAll("body *");
      for (var i = 0; i < all.length && offenders.length < 24; i += 1) {
        var el = all[i];
        if (el.closest(".table-wrap") && el.closest(".table-wrap") !== el) continue;
        var rect = el.getBoundingClientRect();
        if (rect.width > 0 && (rect.right > window.innerWidth + 1 || rect.left < -1)) {
          offenders.push({
            tag: el.tagName.toLowerCase(),
            id: el.id || "",
            cls: typeof el.className === "string" ? el.className.slice(0, 80) : "",
            right: Math.round(rect.right),
            width: Math.round(rect.width),
          });
        }
      }
      var widest = [];
      for (var j = 0; j < all.length; j += 1) {
        var r2 = all[j].getBoundingClientRect();
        if (r2.width > 0) {
          widest.push({ tag: all[j].tagName.toLowerCase(), id: all[j].id || "", cls: typeof all[j].className === "string" ? all[j].className.slice(0, 60) : "", width: Math.round(r2.width) });
        }
      }
      widest.sort(function (a, b) { return b.width - a.width; });
      document.documentElement.setAttribute("data-layout-overflow", overflow ? "true" : "false");
      document.documentElement.setAttribute("data-layout-offenders", JSON.stringify(offenders));
      document.documentElement.setAttribute("data-layout-details", JSON.stringify({
        innerWidth: window.innerWidth,
        htmlScrollWidth: document.documentElement.scrollWidth,
        scrollHeight: document.documentElement.scrollHeight,
        activeTab: state.activeTab,
        widest: widest.slice(0, 8),
      }));
      window.__dashboardLayout = {
        viewportWidth: window.innerWidth,
        scrollWidth: document.documentElement.scrollWidth,
        scrollHeight: document.documentElement.scrollHeight,
        overflow: overflow,
        offenders: offenders,
        activeTab: state.activeTab,
      };
      document.title = (overflow ? "LAYOUT_OVERFLOW" : "LAYOUT_OK") + " " + window.innerWidth + "/" + document.documentElement.scrollWidth + " — Hazakura Editor 第二世代 開発管制室";
    } catch (_) {}
  }

  function handleFileLoad(file) {
    if (!file) return;
    if (file.size > MAX_LOAD_BYTES) {
      showError("JSONファイルが大きすぎます（上限 " + Math.round(MAX_LOAD_BYTES / 1024 / 1024) + " MB）。既存の表示は変更していません。");
      return;
    }
    var reader = new FileReader();
    reader.onerror = function () {
      showError("JSONファイルの読み込みに失敗しました。既存の表示は変更していません。");
    };
    reader.onload = function () {
      var parsed;
      try {
        parsed = JSON.parse(String(reader.result || ""));
      } catch (err) {
        showError("JSONの解析に失敗しました: " + err.message + "。既存の表示は変更していません。");
        return;
      }
      var validation = core.validateDashboardData(parsed);
      if (!validation.ok) {
        var messages = validation.errors.slice(0, 3).map(function (e) { return e.path + ": " + e.message; }).join(" / ");
        showError("JSONのスキーマ検証に失敗しました（" + validation.errors.length + "件）: " + messages + "。既存の表示は変更していません。");
        return;
      }
      state.baseline = state.data;
      state.data = validation.data;
      state.sourceLabel = file.name;
      state.schemaWarnings = validation.warnings;
      state.loadMessage = "「" + file.name + "」を読み込みました（検証警告 " + validation.warnings.length + " 件）。";
      state.errorMessage = null;
      renderAll();
    };
    reader.readAsText(file, "utf-8");
  }

  function boot() {
    initTheme();
    initTabs();
    var input = document.getElementById("json-file-input");
    if (input) {
      input.addEventListener("change", function (ev) {
        var file = ev.target.files && ev.target.files[0];
        handleFileLoad(file);
        ev.target.value = "";
      });
    }

    if (!core) {
      showError("共通ロジック (dashboard-core.cjs) が埋め込まれていません。generate.mjs を実行してください。");
      return;
    }

    var embedded;
    try {
      embedded = readEmbeddedData();
    } catch (err) {
      showError("埋め込みJSONの解析に失敗しました: " + err.message);
      return;
    }
    var validation = core.validateDashboardData(embedded);
    if (!validation.ok) {
      var messages = validation.errors.slice(0, 3).map(function (e) { return e.path + ": " + e.message; }).join(" / ");
      showError("埋め込みJSONのスキーマ検証に失敗しました（" + validation.errors.length + "件）: " + messages);
      return;
    }
    state.data = validation.data;
    state.schemaWarnings = validation.warnings;
    var history = readHistory();
    if (history) state.baseline = history.current || history.previous || null;
    renderAll();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
